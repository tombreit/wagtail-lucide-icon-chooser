[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wagtail-lucide-icon-chooser"
version = "0.1.0"
description = "Lucide icon chooser widget for Wagtail model fields and StreamField, with bundled offline icons and a template tag."
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE", "LICENSE-lucide"]
requires-python = ">=3.13"
authors = [{ name = "Thomas Breitner" }]
keywords = ["wagtail", "django", "lucide", "icons", "icon-chooser", "streamfield"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 7",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "wagtail>=7.1",
]

[project.urls]
Repository = "https://github.com/tombreit/wagtail-lucide-icon-chooser"
Changelog = "https://github.com/tombreit/wagtail-lucide-icon-chooser/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wagtail_lucideiconchooser = [
    "templates/**/*.html",
    "static/**/*",
]
